<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BookShelf Scanner</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252542;
            --accent: #e8b86d;
            --accent-hover: #f4ca85;
            --text-primary: #f5f5f7;
            --text-secondary: #a0a0b0;
            --success: #4ade80;
            --error: #f87171;
            --border: rgba(255,255,255,0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }
        
        /* 背景エフェクト */
        .bg-effect {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(232, 184, 109, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(100, 100, 180, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }
        
        /* ヘッダー */
        header {
            text-align: center;
            padding: 24px 0 32px;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.02em;
            margin-bottom: 4px;
        }
        
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 300;
        }
        
        /* タブナビゲーション */
        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--bg-secondary);
            padding: 6px;
            border-radius: 12px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            background: var(--bg-card);
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .tab-btn:not(.active):hover {
            color: var(--text-primary);
        }
        
        /* タブコンテンツ */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* スキャナーセクション */
        .scanner-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        
        #reader video {
            border-radius: 12px;
        }
        
        .scanner-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .scan-status {
            text-align: center;
            padding: 8px;
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            border-radius: 8px;
            display: none;
        }
        
        .scan-status.show {
            display: block;
        }
        
        .scan-status.found {
            color: var(--success);
        }
        
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        
        .btn-primary:disabled {
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }
        
        /* 手動入力 */
        .manual-input {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        
        .manual-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
        }
        
        .manual-input input::placeholder {
            color: var(--text-secondary);
        }
        
        .manual-input input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* 書籍情報カード */
        .book-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        
        .book-card.show {
            display: block;
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .book-header {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .book-cover {
            width: 100px;
            height: 140px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--bg-card);
            flex-shrink: 0;
        }
        
        .book-cover-placeholder {
            width: 100px;
            height: 140px;
            border-radius: 8px;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        
        .book-info h3 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .book-info .author {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        
        .book-info .isbn {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
        }
        
        /* 評価スター */
        .rating-section {
            margin-bottom: 16px;
        }
        
        .rating-section label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .star-rating {
            display: flex;
            gap: 4px;
        }
        
        .star {
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--bg-card);
            transition: all 0.15s ease;
        }
        
        .star:hover,
        .star.active {
            color: var(--accent);
            transform: scale(1.1);
        }
        
        /* 読了日 */
        .date-section {
            margin-bottom: 16px;
        }
        
        .date-section label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .date-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
        }
        
        .date-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* メモ欄 */
        .memo-section {
            margin-bottom: 20px;
        }
        
        .memo-section label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .memo-input {
            width: 100%;
            min-height: 100px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
        }
        
        .memo-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* 設定セクション */
        .settings-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
        }
        
        .setting-item {
            margin-bottom: 20px;
        }
        
        .setting-item:last-child {
            margin-bottom: 0;
        }
        
        .setting-item label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .setting-item input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
        }
        
        .setting-item input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .setting-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        
        /* トースト通知 */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90%;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .toast.success {
            border-left: 4px solid var(--success);
        }
        
        .toast.error {
            border-left: 4px solid var(--error);
        }
        
        /* プレビューセクション */
        .preview-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .preview-section h4 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        
        .preview-content {
            background: var(--bg-primary);
            border-radius: 10px;
            padding: 16px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }
        
        /* ローディング */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-card);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 履歴リスト */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .history-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .history-item img {
            width: 50px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            background: var(--bg-card);
        }
        
        .history-item-info {
            flex: 1;
            min-width: 0;
        }
        
        .history-item-info h4 {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .history-item-info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="bg-effect"></div>
    
    <div class="container">
        <header>
            <h1>BookShelf</h1>
            <p class="subtitle">スキャンして読書記録</p>
        </header>
        
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="scan">スキャン</button>
            <button class="tab-btn" data-tab="history">履歴</button>
            <button class="tab-btn" data-tab="settings">設定</button>
        </nav>
        
        <!-- スキャンタブ -->
        <div id="tab-scan" class="tab-content active">
            <div class="scanner-section">
                <div id="reader"></div>
                <div class="scan-status" id="scanStatus"></div>
                <div class="scanner-controls">
                    <button id="startScan" class="btn btn-primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                        スキャン開始
                    </button>
                    <button id="stopScan" class="btn btn-secondary" style="display:none;">
                        停止
                    </button>
                </div>
                <div class="manual-input">
                    <input type="text" id="manualIsbn" placeholder="ISBN/JANコードを入力">
                    <button id="manualSearch" class="btn btn-secondary">検索</button>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>書籍情報を取得中...</p>
            </div>
            
            <div class="book-card" id="bookCard">
                <div class="book-header">
                    <img id="bookCover" class="book-cover" src="" alt="">
                    <div class="book-info">
                        <h3 id="bookTitle">タイトル</h3>
                        <p class="author" id="bookAuthor">著者名</p>
                        <span class="isbn" id="bookIsbn">ISBN</span>
                    </div>
                </div>
                
                <div class="rating-section">
                    <label>評価</label>
                    <div class="star-rating" id="starRating">
                        <span class="star" data-rating="1">★</span>
                        <span class="star" data-rating="2">★</span>
                        <span class="star" data-rating="3">★</span>
                        <span class="star" data-rating="4">★</span>
                        <span class="star" data-rating="5">★</span>
                    </div>
                </div>
                
                <div class="date-section">
                    <label>読了日</label>
                    <input type="date" class="date-input" id="readDate">
                </div>
                
                <div class="memo-section">
                    <label>メモ</label>
                    <textarea class="memo-input" id="bookMemo" placeholder="感想やメモを入力..."></textarea>
                </div>
                
                <button id="saveToObsidian" class="btn btn-primary" style="width:100%;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Obsidianに保存
                </button>
                
                <div class="preview-section">
                    <h4>Markdownプレビュー</h4>
                    <pre class="preview-content" id="markdownPreview"></pre>
                </div>
            </div>
        </div>
        
        <!-- 履歴タブ -->
        <div id="tab-history" class="tab-content">
            <div class="history-list" id="historyList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.1
